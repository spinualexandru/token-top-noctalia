id = "spinualexandru/token-top"
name = "Token Top"
version = "0.11.0"
plugin_api = 43
author = "spinualexandru"
license = "MIT"
dependencies = ["rg", "sqlite3"]
tags = ["productivity", "utility"]
icon = "sparkles"
description = "Track Codex, Claude Code, and OpenCode Go quota usage and local session statistics from the bar."

[[setting]]
key = "enable_codex"
type = "bool"
label_key = "settings.enable_codex.label"
description_key = "settings.enable_codex.description"
default = true

[[setting]]
key = "show_five_hour_bar"
type = "bool"
label_key = "settings.show_five_hour_bar.label"
description_key = "settings.show_five_hour_bar.description"
default = false

[[setting]]
key = "show_five_hour_panel"
type = "bool"
label_key = "settings.show_five_hour_panel.label"
description_key = "settings.show_five_hour_panel.description"
default = false

[[setting]]
key = "enable_claude"
type = "bool"
label_key = "settings.enable_claude.label"
description_key = "settings.enable_claude.description"
default = false

[[setting]]
key = "show_claude_five_hour_bar"
type = "bool"
label_key = "settings.show_claude_five_hour_bar.label"
description_key = "settings.show_claude_five_hour_bar.description"
default = true

[[setting]]
key = "show_claude_five_hour_panel"
type = "bool"
label_key = "settings.show_claude_five_hour_panel.label"
description_key = "settings.show_claude_five_hour_panel.description"
default = true

[[setting]]
key = "enable_opencode"
type = "bool"
label_key = "settings.enable_opencode.label"
description_key = "settings.enable_opencode.description"
default = false

[[setting]]
key = "show_opencode_five_hour_bar"
type = "bool"
label_key = "settings.show_opencode_five_hour_bar.label"
description_key = "settings.show_opencode_five_hour_bar.description"
default = true

[[setting]]
key = "show_opencode_five_hour_panel"
type = "bool"
label_key = "settings.show_opencode_five_hour_panel.label"
description_key = "settings.show_opencode_five_hour_panel.description"
default = true

[[widget]]
id = "usage"
entry = "widget.luau"

  # The bar editor's standard presentation settings ("Color" / "Icon Color") store their
  # values under these keys, but Noctalia only seeds declared settings into
  # noctalia.getConfig and does not recolor render() trees itself. Declaring both keys
  # lets the widget honor those controls; visible_when never matches, so the entries
  # stay hidden and the host's own controls remain the only ones shown.
  [[widget.setting]]
  key = "color"
  type = "color"
  label_key = "settings.color.label"
  description_key = "settings.color.description"
  default = "__unset__"
  visible_when = { key = "show_five_hour_bar", values = ["__hidden__"] }

  [[widget.setting]]
  key = "icon_color"
  type = "color"
  label_key = "settings.icon_color.label"
  description_key = "settings.icon_color.description"
  default = "__unset__"
  visible_when = { key = "show_five_hour_bar", values = ["__hidden__"] }

[[panel]]
id = "details"
entry = "panel.luau"
width = 480
height = "content"
max_height = 760
placement = "attached"
position = "auto"

[[service]]
id = "poller"
entry = "service.luau"
